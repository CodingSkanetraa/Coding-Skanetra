<body class="tg-hal">
  <header class="navbar">
    <a class="brand" href="../index.html#beranda" aria-label="CodingSkanetra, beranda">
      <img class="brand-logo" src="../assets/images/logo-eskul.png" alt="" width="38" height="44">
      <span>Coding<span class="brand-accent">Skanetra</span></span>
    </a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Buka navigasi" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="nav-links" aria-label="Navigasi utama">
      <a class="nav-link" href="../index.html#beranda" data-nav="beranda">Beranda</a>
      <a class="nav-link" href="materi.html" data-nav="materi">Materi</a>
      <a class="nav-link" href="playground.html" data-nav="playground">Playground</a>
      <a class="nav-link" href="peringkat.html" data-nav="peringkat">Peringkat</a>
      <a class="nav-link" href="games.html" data-nav="games">Games</a>
      <a class="nav-link" href="tantangan.html" data-nav="tantangan">Tantangan</a>
      <a class="nav-link active" href="kelompok.html" data-nav="kelompok" aria-current="page">Tugas Kelompok</a>
      <a class="nav-link" href="struktur-organisasi.html" data-nav="struktur">Struktur Organisasi</a>
      <a class="nav-link" href="dokumentasi.html" data-nav="dokumentasi">Dokumentasi</a>
      <a class="nav-link" href="about.html" data-nav="about">Tentang</a>
      <a class="nav-link" href="profil.html#tampilan" data-nav="setting">Pengaturan</a>
    </nav>
  </header>

  <main class="tg kg kg-ed">
    <a class="tg-kembali" id="kg-balik" href="kelompok.html">&larr; Detail tugas</a>
    <p class="tg-pesan" id="tg-pesan" role="status" aria-live="polite">Memuat…</p>
    <div class="tg-tamu" id="tg-tamu" hidden></div>

    <section id="tg-isi" hidden>
      <header class="kg-judul">
        <div>
          <h1 id="kg-judul"></h1>
          <p class="tg-sub" id="kg-sub"></p>
        </div>
        <div class="kg-simpan-bar">
          <span class="kg-simpan-status" id="kg-simpan-status" role="status" aria-live="polite">Tersimpan</span>
          <button class="tg-btn utama" id="kg-simpan" type="button">Simpan</button>
        </div>
      </header>

      <div class="kg-chip-bungkus" id="kg-chip" role="tablist" aria-label="Bagian website"></div>
      <div class="kg-info-bagian" id="kg-info"></div>

      <div class="kg-ed-grid">
        <div class="kg-ed-kolom">
          <div class="kg-tab" role="tablist" aria-label="Bahasa">
            <button type="button" role="tab" class="kg-tab-btn" data-b="html" aria-selected="true">HTML</button>
            <button type="button" role="tab" class="kg-tab-btn" data-b="css" aria-selected="false">CSS</button>
            <button type="button" role="tab" class="kg-tab-btn" data-b="js" aria-selected="false">JS</button>
            <button type="button" class="kg-tab-btn kg-riwayat" id="kg-riwayat">Riwayat</button>
          </div>
          <div class="kg-cm" id="kg-cm"></div>
        </div>
        <div class="kg-ed-kolom">
          <div class="kg-tab" role="tablist" aria-label="Tampilan website">
            <button type="button" role="tab" class="kg-tab-btn" data-v="hasil" aria-selected="true">Hasil utuh</button>
            <button type="button" role="tab" class="kg-tab-btn" data-v="kode" aria-selected="false">Kode utuh</button>
          </div>
          <iframe class="kg-iframe" id="kg-iframe" title="Pratinjau website utuh"></iframe>
          <pre class="kg-kode" id="kg-kode" hidden></pre>
        </div>
      </div>
    </section>

    <dialog class="tg-dialog" id="kg-dialog" aria-labelledby="kg-dlg-judul">
      <form id="kg-dlg-form" method="dialog">
        <h2 id="kg-dlg-judul"></h2>
        <div id="kg-dlg-isi"></div>
        <p class="tg-galat" id="kg-dlg-galat" role="alert" hidden></p>
        <div class="tg-baris-aksi" id="kg-dlg-aksi"></div>
      </form>
    </dialog>
  </main>
</body>
</html>
