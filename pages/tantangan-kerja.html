<body class="tg-hal">
  <header class="navbar">
    <a class="brand" href="../index.html#beranda" aria-label="CodingSkanetra, beranda">
      <img class="brand-logo" src="../assets/images/logo-eskul.png" alt="" width="38" height="44">

    </a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Buka navigasi" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav-links" id="nav-links" aria-label="Navigasi utama">
      <a class="nav-link" href="../index.html#beranda" data-nav="beranda">Beranda</a>

    </nav>
  </header>

  <main class="tg tg-kerja">
    <a class="tg-kembali" href="tantangan.html">&larr; Semua tantangan</a>
    <p class="tg-pesan" id="tg-pesan" role="status" aria-live="polite">Memuat…</p>
    <div class="tg-tamu" id="tg-tamu" hidden></div>

    <div class="tg-grid" id="tg-isi" hidden>
      <section class="tg-soal" aria-labelledby="tg-judul">
        <div class="tg-lencana" id="tg-lencana"></div>
        <h1 id="tg-judul"></h1>
        <div class="tg-deskripsi" id="tg-deskripsi"></div>
        <a class="tg-btn" id="tg-coba" href="#" target="_blank" rel="noopener">Coba dulu di editor</a>
      </section>

      <section class="tg-jawab" aria-labelledby="tg-jawab-judul">
        <h2 id="tg-jawab-judul">Jawabanmu</h2>
        <p class="tg-status" id="tg-status" hidden></p>
        <label class="sr-only" for="tg-kode">Kode jawaban</label>
        <textarea id="tg-kode" class="tg-kode" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" rows="16" maxlength="20000"></textarea>
        <div class="tg-aksi">
          <button class="tg-btn utama" id="tg-kirim" type="button">Kirim jawaban</button>
          <span class="tg-petunjuk" id="tg-petunjuk">Ctrl + Enter untuk mengirim</span>
        </div>
        <div class="tg-hasil" id="tg-hasil" role="status" aria-live="polite" hidden></div>
      </section>
    </div>
  </main>
